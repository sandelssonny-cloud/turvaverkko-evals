[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turvaverkko"
version = "0.1.0"
description = "Evals for context-dependent behaviour of AI companions toward vulnerable young users"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "inspect-ai>=0.3",
    "pyyaml>=6",
    "pandas>=2",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
providers = ["anthropic", "openai", "google-genai"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
